name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch fishhook
        run: |
          curl -fsSL https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c -o Sources/fishhook.c
          curl -fsSL https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h -o Sources/fishhook.h

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild -project IPAPlayer.xcodeproj -scheme IPAPlayer \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | tail -n 40

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/IPAPlayer.app Payload/
          zip -qr IPAPlayer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: IPAPlayer-unsigned
          path: IPAPlayer.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
