name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch fishhook
        run: |
          curl -fsSL https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c -o Sources/fishhook.c
          curl -fsSL https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h -o Sources/fishhook.h

      - name: Write project spec
        run: |
          cat > project.yml <<'EOF'
          name: IPAPlayer
          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "15.0"
          packages:
            ZIPFoundation:
              url: https://github.com/weichsel/ZIPFoundation
              from: 0.9.19
          targets:
            IPAPlayer:
              type: application
              platform: iOS
              sources: [Sources]
              dependencies:
                - package: ZIPFoundation
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: IPA Player
                  UILaunchScreen: {}
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  CFBundleDocumentTypes:
                    - CFBundleTypeName: iOS App
                      CFBundleTypeRole: Viewer
                      LSHandlerRank: Alternate
                      LSItemContentTypes: [com.apple.itunes.ipa]
                  UTImportedTypeDeclarations:
                    - UTTypeIdentifier: com.apple.itunes.ipa
                      UTTypeDescription: iOS App
                      UTTypeConformsTo: [public.data, public.zip-archive]
                      UTTypeTagSpecification:
                        public.filename-extension: [ipa]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.ipaplayer
                  SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging-Header.h
                  SWIFT_VERSION: "5.0"
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
          EOF

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (no signing)
        run: |
          set +e
          xcodebuild -project IPAPlayer.xcodeproj -scheme IPAPlayer \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build.log 2>&1
          STATUS=$?
          echo "xcodebuild exit code: $STATUS"
          if [ $STATUS -ne 0 ]; then
            echo "===== ERRORS ====="
            grep -E "error:" build.log | sort -u | head -40
            echo "===== LAST 40 LINES ====="
            tail -n 40 build.log
            exit $STATUS
          fi

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/IPAPlayer.app
          test -f "$APP/IPAPlayer" || { echo "Executable missing in $APP"; ls -la "$APP"; exit 1; }
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr IPAPlayer.ipa Payload

      - name: Inspect IPA
        run: |
          ls -la IPAPlayer.ipa
          unzip -l IPAPlayer.ipa
          plutil -p Payload/IPAPlayer.app/Info.plist

      - uses: actions/upload-artifact@v4
        with:
          name: IPAPlayer-unsigned
          path: IPAPlayer.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
